/*__RL_FONT__*/
:root{
  /* 配色: ダークニューモフィズム「Ember」（既定）。面・影・光は同じ色相で明度だけを振り、区切りは凹凸で付ける。
     クレイは押した・選んだ状態とリンク、赤は失敗、オートは中断などの情報。もう一つの「Kiln」は下で差し替える */
  --bg:#2B2A27;--sh:#1D1C1A;--hl:#393834;--sh-1:#21201E;--hl-1:#34332F;--hover:#2F2E2B;
  --fg:#EEECE4;--fg-2:#C9C6BC;--muted:#A9A79E;--dim:#959389;
  --accent:#D97757;--accent-deep:#B5583A;--info:#E3DACC;--str:#D9A58C;
  --focus:#D97757;--link:#D97757;--link-hi:#E8916F;--link-dk:#A84F33;--link-a:rgba(217,119,87,.4);
  --ring:rgba(217,119,87,.45);--sel:rgba(217,119,87,.32);
  --err:#EE7B80;--err-glow:rgba(238,123,128,.4);--warn:#E2B85E;--run:#E0A452;
  --line:#393834;--rail:#35342F;--sep:#3A3935;--sep-2:#45443F;
  /* 端末の配色が無いときの出力の文字色（出力は面の上に置く）。配色があれば JS が上書きする */
  --term-bg:#1D1C1A;--term-fg:#C9C6BC;
  /* 浮き出し（--up）・へこみ（--in）と、その浅い版（-1）。検索欄（--in-2）と開いた中身（--in-3）は深め */
  --up:3px 3px 6px var(--sh),-3px -3px 6px var(--hl);
  --up-1:1.5px 1.5px 3px var(--sh-1),-1.5px -1.5px 3px var(--hl-1);
  --up-2:6px 6px 12px var(--sh),-6px -6px 12px var(--hl);
  --in:inset 3px 3px 6px var(--sh),inset -3px -3px 6px var(--hl);
  --in-1:inset 1.5px 1.5px 3px var(--sh-1),inset -1.5px -1.5px 3px var(--hl-1);
  --in-2:inset 4px 4px 8px var(--sh),inset -4px -4px 8px var(--hl);
  --in-3:inset 4px 4px 10px var(--sh),inset -4px -4px 10px var(--hl);
  /* コマンドと出力は Fira Code（無ければ次の等幅フォント）。見出しは明朝、画面の文字は読みやすいゴシック */
  --mono:"Fira Code","FiraCode Nerd Font","FiraCode Nerd Font Mono","Fira Mono","JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",monospace;
  --sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
  --serif:"Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --pc0:#7DA7D9;--pc1:#A99BD6;--pc2:#8FB39A;--pc3:#D2B47E;--pc4:#D99BB0;--pc5:#78B4B4;--pc6:#A9B66F;--pc7:#93A3B8;
  /* 閉じた行・日付の区切りの高さ。まだ作っていない行の見積もり（JS の EST / DAYH）と
     描画前の行の大きさ（.row の contain-intrinsic-size）にも使い、三つを揃えてスクロールのずれを無くす */
  --rowh:48px;--dayh:46px;--barh:130px;
}
/* もう一つの配色「Kiln」: 黒に近い深い面で、凹凸は控えめ。リンク・情報・フォーカスはスカイ。
   失敗の赤は、明るいクレイと明るさでも見分けられる赤にする。出力の色（--term-*）は JS が決めるので変えない */
:root[data-theme="kiln"]{
  --bg:#1E1D1B;--sh:#121211;--hl:#2B2A27;--sh-1:#181716;--hl-1:#252421;--hover:#232220;
  --fg:#F2F0E8;--fg-2:#CCCAC2;--muted:#9E9C94;--dim:#8A8881;
  --accent:#E0896A;--accent-deep:#C46A4C;--info:#6A9BCC;--str:#DDA990;
  --focus:#6A9BCC;--link:#6A9BCC;--link-hi:#8DB4DB;--link-dk:#2C5F8F;--link-a:rgba(106,155,204,.4);
  --ring:rgba(106,155,204,.55);--sel:rgba(106,155,204,.35);
  --err:#E5645E;--err-glow:rgba(229,100,94,.4);
  --line:#2B2A27;--rail:#292826;--sep:#2E2D2A;--sep-2:#3A3935;
}
*,*::before,*::after{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
code,kbd,pre,samp{font-family:var(--mono)}
::selection{background:var(--sel)}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{flex:none;width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.pc0{--pc:var(--pc0)}.pc1{--pc:var(--pc1)}.pc2{--pc:var(--pc2)}.pc3{--pc:var(--pc3)}
.pc4{--pc:var(--pc4)}.pc5{--pc:var(--pc5)}.pc6{--pc:var(--pc6)}.pc7{--pc:var(--pc7)}
/* 本文の幅は 1280px（左右の余白 24px を足して 1328px） */
.wrapx{max-width:1328px;margin:0 auto;padding:0 24px}

/* ---------- header ---------- */
.hero{padding:56px 0 20px}
.hero>.wrapx{position:relative}
/* 配色の切り替え（右上）。選んでいる方は浅くへこんでクレイ */
.themes{position:absolute;top:-7px;right:24px;display:flex;gap:10px}
.themes .btn{height:28px;padding:0 12px;font-size:12px;font-weight:400;color:var(--muted);box-shadow:var(--up-1)}
.themes .btn:hover{color:var(--fg)}
.themes .btn.on{font-weight:600;color:var(--accent);box-shadow:var(--in-1)}
.brand{font:400 12px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
h1{margin:10px 0 20px;font:500 44px/1.2 var(--serif);color:var(--fg);overflow-wrap:anywhere}
/* 記録の情報は、小さな見出しの下に値 */
.sub{display:flex;flex-wrap:wrap;gap:16px 40px}
.sub>div{display:flex;flex-direction:column;gap:4px;min-width:0}
.sub .k{font:400 11px var(--mono);letter-spacing:.12em;color:var(--muted)}
.sub .v{font-size:14px;line-height:normal;color:var(--fg);overflow-wrap:anywhere}
.sub .v i{font-style:normal;color:var(--muted)}
.notice{margin-top:24px;display:flex;gap:10px;align-items:flex-start;color:var(--fg-2);font-size:12.5px;background:var(--bg);box-shadow:var(--in-3);border-radius:16px;padding:12px 14px 12px 20px}
.notice .ni{color:var(--info)}
.notice .nb{flex:1;min-width:0}
.notice .code{display:inline;font:12px var(--mono);color:var(--link);background:transparent;border:0;padding:0 2px;cursor:pointer;overflow-wrap:anywhere;text-align:left;text-decoration:underline;text-decoration-color:var(--link-a);text-underline-offset:3px}
.notice .code:hover{color:var(--link-hi)}
.notice .nx{flex:none;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:var(--bg);box-shadow:var(--up-1);color:var(--muted);font:14px/1 var(--sans);cursor:pointer}
.notice .nx:hover{color:var(--fg);box-shadow:var(--up)}

/* ---------- toolbar ---------- */
/* 検索バーは上に貼り付く。下の影は、スクロールして貼り付いている間だけ */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);transition:box-shadow .2s}
.toolbar.stuck{box-shadow:0 10px 14px -12px rgba(0,0,0,.7)}
.tb{padding-top:12px;padding-bottom:12px;display:flex;flex-direction:column;gap:16px}
/* 1 行目は検索欄と表示の操作（折り返し・すべて展開／閉じる・?）。2 行目は絞り込みのチップだけ */
.srow{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px}
/* 検索まわりは 1 本の溝に。Aa・.*・↑↓ は欄の中で影なし（オンはクレイ） */
.search{flex:1 1 480px;min-width:0;height:48px;display:flex;align-items:center;gap:4px;padding:0 8px 0 16px;border-radius:14px;background:var(--bg);box-shadow:var(--in-2);transition:box-shadow .15s}
.search:focus-within{box-shadow:var(--in-2),0 0 0 2px var(--ring)}
.search>svg.i{width:18px;height:18px;margin-right:8px;color:var(--muted)}
/* 検索語が入っている間: 虫眼鏡はクレイ、入力は等幅 */
.search.q>svg.i{color:var(--accent)}
.search.q #q{font-family:var(--mono)}
#q{flex:1;min-width:60px;height:100%;background:transparent;border:0;outline:0;color:var(--fg);font:14px var(--sans);padding:0}
#q::placeholder{color:var(--muted);opacity:1}
#q::-webkit-search-cancel-button{display:none}
.count{flex:none;padding:0 6px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.count:empty{display:none}
.count.bad{color:var(--err)}
.count b{font-weight:400;color:var(--fg)}
/* 検索語を消す × */
.sclr{width:28px;height:28px;margin-right:4px;border-radius:50%}
.sclr svg.i{width:14px;height:14px;stroke-width:2.2}
.sbtn{flex:none;width:34px;height:32px;padding:0;border:0;border-radius:8px;background:transparent;color:var(--muted);font:600 12px var(--mono);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;transition:color .15s,box-shadow .15s}
.sbtn:hover{color:var(--fg)}
.sbtn.on{color:var(--accent);box-shadow:var(--in-1)}
.sbtn svg.i{width:16px;height:16px}
#prev,#next{width:32px}
.search.hasm :is(#prev,#next){color:var(--fg)}
.isep{flex:none;width:1px;height:18px;background:var(--sep);margin:0 6px}
/* ボタンとチップは面から浮き出させる。押したまま（.on）はへこませてクレイの文字に */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border:0;border-radius:999px;background:var(--bg);color:var(--fg);font:500 13px var(--sans);cursor:pointer;white-space:nowrap;box-shadow:var(--up);transition:box-shadow .15s,color .15s}
.btn:active{box-shadow:var(--in)}
.btn.on{box-shadow:var(--in);color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:6px 6px 2px}
#pane-chips{display:contents}
/* 絞り込みのチップ（失敗・リモート・ペイン）: 押すとその行を隠す */
.chip{max-width:100%}
.chip.pane{font-family:var(--mono);font-weight:400}
.chip .lbl{min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.chip b{font:inherit;font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.chip svg.i{color:var(--muted)}
.chip svg.x{width:12px;height:12px;stroke-width:3;color:var(--err)}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chip:disabled{opacity:.45;box-shadow:none;cursor:default;pointer-events:none}
/* 隠している間は沈んで薄く。クレイは「オンにした設定」（検索範囲・Aa・.*・折り返し）だけに使う */
:is(#f-failed,#f-remote,.chip.pane).on{color:var(--dim);box-shadow:var(--in)}
:is(#f-failed,#f-remote,.chip.pane).on :is(b,svg.i,.dot){opacity:.45}
.vsep{flex:none;width:1px;height:24px;background:var(--line)}
/* すべて展開・すべて閉じるは 1 つの浮いた帯に */
.pair{display:flex;align-items:center;height:34px;padding:0 4px;border-radius:999px;background:var(--bg);box-shadow:var(--up)}
.pair .btn{padding:0 12px;background:transparent;box-shadow:none}
.pair .btn:active{box-shadow:none;color:var(--accent)}
.pair i{width:1px;height:18px;background:var(--sep-2)}
#help-btn{width:34px;padding:0;font-size:15px;font-weight:600}

/* ---------- timeline ---------- */
main{padding-bottom:70px}
.tl{position:relative}
.day{display:flex;align-items:center;gap:16px;height:var(--dayh);padding:19px 16px 12px;line-height:15px;color:var(--muted);font:12px var(--mono);letter-spacing:.08em;scroll-margin-top:calc(var(--barh) + 8px)}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
/* 行 = 時刻・左の線と印・見出し（開くと中身が下に付く）。閉じた行の高さ = 見出しの 48px = --rowh */
.row{display:grid;grid-template-columns:104px 24px minmax(0,1fr);align-items:start;border-radius:12px;content-visibility:auto;contain-intrinsic-size:auto var(--rowh);scroll-margin-top:calc(var(--barh) + 12px);scroll-margin-bottom:24px}
.row>.tm{padding:14px 0 0 16px;font:13px/20px var(--mono);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.row>.rail{position:relative;align-self:stretch}
.row>.rail::before{content:"";position:absolute;left:11px;top:0;bottom:0;width:2px;background:var(--rail)}
/* 線は日付の区切りの下と、並びの終わりで少し手前で止める */
.day+.row>.rail::before{top:8px}
.row:has(+.day)>.rail::before,.grp:last-child>.row:last-child>.rail::before{bottom:8px}
/* 印はペインの色の点。失敗は赤くしてほのかに光らせ、^C の中断は輪だけ、実行中は橙、コマンド外は点線の輪 */
.row>.rail::after{content:"";position:absolute;left:7px;top:19px;width:10px;height:10px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px var(--bg)}
.row.fail>.rail::after{background:var(--err);box-shadow:0 0 0 4px var(--bg),0 0 10px 2px var(--err-glow)}
.row.intr>.rail::after{background:var(--bg);border:2px solid var(--pc)}
.row.run>.rail::after{background:var(--run)}
.row.misc>.rail::after{background:var(--bg);border:2px dashed var(--dim)}
/* 閉じた行のホバー: 行ごと少し明るく浮く。その行の線は隠し、印の縁取りも同じ色に */
.row:has(>.card:not(.open)>.sum:hover){background:var(--hover);box-shadow:var(--up)}
.row:has(>.card:not(.open)>.sum:hover)>.rail::before{visibility:hidden}
.row:has(>.card:not(.open)>.sum:hover)>.rail::after{box-shadow:0 0 0 4px var(--hover)}
.row.fail:has(>.card:not(.open)>.sum:hover)>.rail::after{box-shadow:0 0 0 4px var(--hover),0 0 10px 2px var(--err-glow)}
.card{min-width:0}
.sum{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:16px;width:100%;min-height:48px;padding:14px 16px;border-radius:12px;cursor:pointer}
.sum:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}
/* 見出しのコマンド: コマンド名は太字、オプションと区切り記号は薄く、引用符の文字列は色付き */
.cmd{flex:1;min-width:0;max-height:20px;font:14px/20px var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2)}
.cmd .cw{color:var(--fg);font-weight:600}
.cmd .co{color:var(--muted)}
.cmd .cs{color:var(--str)}
/* 開いたら（検索で今の一致がコマンドにあるときも）見出しのコマンドを折り返して全文を見せる。中では繰り返さない */
.card.open>.sum .cmd,.card.cmdcur>.sum .cmd{max-height:none;white-space:pre-wrap;word-break:break-all}
/* 開いている間は見出しのコマンドの文字を選択できる（文字の上のクリックでは閉じない。余白・右側で閉じる） */
.card.open>.sum .ct{cursor:text;-webkit-user-select:text;user-select:text}
/* 複数行のコマンドは、閉じている間は 1 行目だけ（続きの行数の印） */
.mlh{flex:none;color:var(--dim);font:12px/20px var(--mono)}
.card.open>.sum>.mlh,.card.cmdcur>.sum>.mlh{display:none}
.cmd.misc{font-family:var(--sans);font-style:italic;color:var(--muted)}
/* 右側: ペイン（変わった行だけ）・行数・所要時間を「·」でつなぎ、終わり方（失敗・中断・実行中）を添える */
.meta{flex:none;margin-left:auto;display:flex;align-items:center;gap:12px;height:20px;color:var(--muted);font:12px var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.facts{display:flex;align-items:center;gap:8px}
.ptag{display:inline-flex;align-items:center;gap:6px;color:var(--fg);max-width:180px;overflow:hidden;text-overflow:ellipsis}
.ptag::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--pc)}
.xm{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.xm.err{color:var(--err)}
.xm.err svg.i{width:10px;height:10px;stroke-width:3.5}
.xm.intr{color:var(--info)}
.xm.run{color:var(--run)}
.xm.run::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.badge{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font:600 11.5px/16px var(--mono);white-space:nowrap}
.badge.remote{flex:none;color:var(--info);box-shadow:var(--in-1)}
/* 出力の中の一致の数（ssh などは中の一致の合計） */
.hitc{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font:500 11px var(--sans);color:color-mix(in srgb,var(--accent) 70%,var(--fg));background:color-mix(in srgb,var(--accent) 14%,transparent)}
.hitc svg.i{width:11px;height:11px;stroke-width:2.5}
/* 検索中、コマンドにも出力にも一致が無い行は薄く（開いている行とホバー中の行は除く） */
:is(.row,.krow,.kban){transition:opacity .15s}
:is(.row,.krow).nohit:not(:has(>.card.open)):not(:hover),.kban.nohit:not(:has(>.kbtn[aria-expanded="true"])):not(:hover){opacity:.4}

/* ---------- body ---------- */
/* 開いた中身は面のへこみ。上に場所などの情報とコピーのボタン、下に出力 */
.body{margin:2px 16px 14px;border-radius:16px;background:var(--bg);box-shadow:var(--in-3)}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:12px 24px;padding:12px 14px 12px 20px}
.kv{flex:1 1 420px;min-width:0;display:flex;flex-wrap:wrap;align-items:center;gap:6px 22px}
.fact{display:inline-flex;gap:6px;align-items:baseline;min-width:0;overflow-wrap:anywhere;font-size:12px}
.fact i{flex:none;font-style:normal;color:var(--muted)}
.fact span{color:var(--fg)}
.fact .mono{font-family:var(--mono)}
.fact span.muted{color:var(--muted)}
.fact .tc{font-family:var(--mono);color:var(--term-fg);white-space:pre-wrap;word-break:break-all}
.acts{flex:none;display:flex;flex-wrap:wrap;gap:10px}
/* コピーなどのボタンは薄く浮いたチップ。触ると普通の深さまで浮き、コピーした直後は浅くへこんでクレイに */
.act{height:28px;gap:6px;padding:0 11px;font-size:12px;font-weight:400;color:var(--muted);box-shadow:var(--up-1)}
.act:hover{color:var(--fg);box-shadow:var(--up)}
.act.done{font-weight:600;color:var(--accent);box-shadow:var(--in-1)}
.act svg.i{width:13px;height:13px}
.act.done svg.i{stroke-width:2.5}
.out{margin:0;padding:8px 20px 18px;font:13px/1.8 var(--mono);color:var(--term-fg);overflow:auto;max-height:74vh;tab-size:8}
.l{display:flex;min-height:1.8em}
.l::before{content:attr(data-n);flex:none;width:var(--lnw,4ch);margin-right:20px;text-align:right;color:var(--dim);user-select:none;-webkit-user-select:none}
.l>.t{white-space:pre;flex:1}
.wrapon .l>.t{white-space:pre-wrap;word-break:break-all}
.l:hover{background:rgba(238,236,228,.03)}
.ph{margin:6px 0 6px calc(var(--lnw,4ch) + 20px);padding:7px 12px;border:1px dashed var(--sep-2);border-radius:10px;color:var(--muted);font:12px var(--sans);white-space:pre-wrap}
/* 「残り N 行を表示」は文字だけのボタン（クレイ） */
.more{display:block;height:32px;margin:0;padding:0;border:0;background:transparent;color:var(--link);font:500 12px var(--sans);cursor:pointer}
.more:hover{color:var(--link-hi)}
/* ssh などを開いたとき: 中に接続先だけの小さなタイムラインを置き、ログインバナーは最初の 1 項目として畳む */
.kids{padding:2px 20px 14px}
.kidtitle{display:flex;align-items:center;gap:8px;padding-bottom:6px;font:12px var(--sans);color:var(--muted)}
.kidtitle svg.i{width:14px;height:14px}
.kidtitle .tgt{font-family:var(--mono);color:var(--fg)}
.ktl{position:relative}
.ktl::before{content:"";position:absolute;top:18px;bottom:18px;left:84px;width:2px;border-radius:1px;background:var(--rail)}
/* 入れ子の行: 時刻 64px・印 7px・高さ 36px と、外の行より一回り小さく */
:is(.krow,.kban){display:grid;grid-template-columns:64px 10px minmax(0,1fr);column-gap:16px;align-items:start;border-radius:10px;scroll-margin-top:calc(var(--barh) + 12px)}
:is(.krow,.kban)>.tm{padding-top:8px;font:12px/20px var(--mono);color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
:is(.krow,.kban)>.rail{position:relative;align-self:stretch}
:is(.krow,.kban)>.rail::after{content:"";position:absolute;left:1.5px;top:14.5px;width:7px;height:7px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 3px var(--bg)}
.krow.fail>.rail::after{background:var(--err);box-shadow:0 0 0 3px var(--bg),0 0 8px 1px var(--err-glow)}
.krow.intr>.rail::after,.kban>.rail::after{background:var(--bg);border:1.5px solid var(--pc)}
.krow.run>.rail::after{background:var(--run)}
.krow .sum{min-height:36px;padding:8px 0;border-radius:8px}
.krow .cmd{font-size:13px}
.krow .body{margin:2px 0 10px}
.krow:has(>.card:not(.open)>.sum:hover),.kban:has(>.kbtn:hover){background:var(--hover)}
.krow:has(>.card:not(.open)>.sum:hover)>.rail::after,.kban:has(>.kbtn:hover)>.rail::after{box-shadow:0 0 0 3px var(--hover)}
/* ログインバナー: 押すと下に出力を開く（山形が下を向く） */
.kban{grid-template-columns:64px 10px minmax(0,1fr) auto;align-items:center;min-height:36px}
.kban>.tm{padding-top:0}
.kbtn{display:flex;align-items:center;gap:6px;height:32px;min-width:0;padding:0;border:0;background:transparent;font:13px var(--sans);color:var(--muted);text-align:left;cursor:pointer}
.kbtn:hover{color:var(--fg)}
.kbtn svg.i{width:12px;height:12px;stroke-width:2.5;transition:transform .2s ease}
.kbtn[aria-expanded="true"] svg.i{transform:rotate(90deg)}
.kban>.bn{font:12px var(--mono);color:var(--muted);white-space:nowrap}
.kout{margin:0 0 6px 106px}
/* 端末の配色が明るい（Kali-Light など）: 出力は端末の背景色の窓に一段深く入れ、暗い文字に。
   cwd の代わりに出すプロンプトも、端末で見えていたとおり端末の背景色の上に */
.tlight .out{margin:0 12px 12px;padding:12px 16px 14px;border-radius:12px;background:var(--term-bg);box-shadow:inset 3px 3px 7px rgba(0,0,0,.4);--dim:#6A6862;color-scheme:light}
.tlight .out .l:hover{background:rgba(31,30,27,.05)}
.tlight .out .ph{border-color:rgba(31,30,27,.25);color:#55534D}
.tlight .out .more{color:var(--link-dk)}
.tlight .fact .tc{background:var(--term-bg);color:var(--term-fg);border-radius:4px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 端末の配色が暗い: 出力は面の上に置くので、色の付いていない文字は面の文字色に（色の付いた文字は端末の色のまま） */
.tdark .out,.tdark .fact .tc{--term-fg:var(--fg-2)}
mark{background:var(--sel);color:var(--fg);border-radius:3px;padding:0 1px}
mark.cur{background:var(--accent);color:#1A1918}
/* 明るい端末の配色の出力では、ふつうの一致の文字は端末の暗い文字のまま */
.tlight .out mark:not(.cur){color:inherit}
/* 今の一致は、色の付いた文字も暗い色で（黄色の上で読めるように。隠し文字は styleSheet で隠したまま） */
.out mark.cur>span,.tc mark.cur>span{color:#1A1918;background:transparent;opacity:1}
/* 長いコマンドの省略の印 */
.cmd .cut{color:var(--dim);font-style:italic}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty h2{color:var(--fg);font:500 24px/1.4 var(--serif);margin:0 0 8px}
.empty p{margin:0}
/* 「検索とフィルタを解除」はこの画面の主な操作なので、クレイで塗る */
.empty .btn{margin-top:20px;height:44px;padding:0 22px;border-radius:14px;font-weight:700;color:#1A1918;background:var(--accent);box-shadow:var(--up-2)}
.empty .btn:hover{background:var(--accent-deep)}
footer{padding:0 0 46px;color:var(--muted);font-size:12px}
footer .wrapx{border-top:1px solid var(--line);padding-top:22px}
footer details{margin-top:6px}
footer summary{cursor:pointer;color:var(--muted);list-style:none}
footer summary::-webkit-details-marker{display:none}
/* 開閉の印はプロンプトの ❯（開くと 90° 回る） */
footer summary::before{content:"❯";display:inline-block;margin-right:8px;color:var(--link);font-family:var(--mono);transition:transform .2s ease}
footer details[open]>summary::before{transform:rotate(90deg)}
footer table{border-collapse:collapse;margin-top:8px;font:11.5px var(--mono)}
footer td{padding:4px 12px 4px 0;vertical-align:top;color:var(--muted);overflow-wrap:anywhere}
footer td:first-child{white-space:nowrap;color:var(--fg)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--bg);box-shadow:var(--up-2);color:var(--fg);padding:9px 18px;border-radius:999px;font-size:13px;transition:opacity .18s,transform .18s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(20,19,18,.6)}
.hbox{background:var(--bg);border-radius:24px;padding:24px 28px;min-width:min(320px,100%);max-width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px -18px #000}
.hbox:focus{outline:none}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 14px}
.hbox h2{margin:0;font:500 20px var(--serif)}
.ib{width:32px;height:32px;padding:0;border:0;border-radius:50%;background:var(--bg);box-shadow:var(--up-1);color:var(--muted);font:16px/1 var(--sans);cursor:pointer}
.ib:hover{color:var(--fg);box-shadow:var(--up)}
.hbox td{padding:6px 10px;color:var(--fg-2);font-size:13px}
.hbox td:first-child{text-align:right;white-space:nowrap}
kbd{display:inline-block;font:11px var(--mono);color:var(--fg);background:var(--bg);border-radius:6px;padding:2px 7px;box-shadow:var(--up-1)}
.totop{position:fixed;right:22px;bottom:22px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);box-shadow:var(--up-2);color:var(--fg);font:16px/1 var(--sans);cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s,transform .2s,visibility .2s}
.totop.show{opacity:1;visibility:visible;transform:none}
[hidden]{display:none!important}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--sep-2);border-radius:8px;border:3px solid var(--bg)}
.tlight .out::-webkit-scrollbar-thumb{background:#B8B5AC;border-color:var(--term-bg)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-color:var(--sep-2) transparent}
@media (max-width:760px){
  .wrapx{padding-left:14px;padding-right:14px}
  .hero{padding-top:36px}
  .themes{position:static;justify-content:flex-end;margin-bottom:14px}
  h1{font-size:32px}
  .sub{gap:12px 24px}
  .search{flex-basis:100%;padding-left:12px}
  .sbtn{width:30px}
  .row{grid-template-columns:0 20px minmax(0,1fr)}
  .row>.tm,:is(.krow,.kban)>.tm{visibility:hidden}
  .row>.rail::before{left:9px}
  .row>.rail::after{left:5px}
  .krow{grid-template-columns:0 10px minmax(0,1fr);column-gap:10px}
  .kban{grid-template-columns:0 10px minmax(0,1fr) auto;column-gap:10px}
  .ktl::before{left:14px}
  .kout{margin-left:30px}
  .kids{padding-left:12px;padding-right:12px}
  .day{padding-left:4px;padding-right:4px}
  .meta .facts{display:none}
  .sum{gap:12px;padding-left:12px;padding-right:12px}
  .body{margin:2px 4px 12px 8px}
  .card.open>.sum,.card.cmdcur>.sum{flex-wrap:wrap}
  .card.open>.sum .cmd,.card.cmdcur>.sum .cmd{flex-basis:100%}
  .card.open>.sum .meta,.card.cmdcur>.sum .meta{margin-left:auto}
}

</div></div>

<main class="wrapx">

<script>
(() => {
"use strict";
/* ログの中身は攻撃者が制御しうる。描画は textContent / createTextNode だけで行い、
   innerHTML や href / src / style 属性にはデータを一切入れない。 */

/* ---------- データ ---------- */
let D = {};
try { D = JSON.parse(document.getElementById("rl-data").textContent) || {}; } catch (e) { D = {}; }
const M = D.meta && typeof D.meta === "object" ? D.meta : {};
const PANES = (Array.isArray(D.panes) ? D.panes : []).map(p => (p && typeof p === "object" ? p : {}));
const BLOCKS = (Array.isArray(D.blocks) ? D.blocks : []).filter(b => b && typeof b === "object");
const STYLES = Array.isArray(D.styles) ? D.styles : [];

const $ = s => document.querySelector(s);
const str = v => (typeof v === "string" ? v : "");
const num = v => (typeof v === "number" && isFinite(v) ? v : null);
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
let NF = null;
try { NF = new Intl.NumberFormat(); } catch (e) { /* Intl が無い環境 */ }
const fmtN = n => (NF ? NF.format(Number(n)) : String(n));  // toLocaleString は毎回だと遅い
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(cls, text, title) {
  const b = h("button", cls, text);
  b.type = "button";
  if (title) b.title = title;
  return b;
}
// 線のアイコン（パスは固定の文字列で、データは入れない）
const ICONS = {
  cmd: ["M5 7l5 5-5 5M12 18h7"],
  out: ["M5 6h14M5 12h14M5 18h9"],
  link: ["M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1", "M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"],
  ok: ["M5 12l5 5 9-10"],
  x: ["M6 6l12 12M18 6L6 18"],
  remote: ["M4 8h14l-3-3M20 16H6l3 3"],
  search: ["M18 11a7 7 0 1 1-14 0a7 7 0 1 1 14 0", "M20 20l-3.5-3.5"],
  chev: ["M9 6l6 6-6 6"],
};
function icon(name) {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("class", "i");
  s.setAttribute("viewBox", "0 0 24 24");
  s.setAttribute("aria-hidden", "true");
  for (const d of ICONS[name]) {
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    s.appendChild(p);
  }
  return s;
}
let RM = false;
try { RM = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { /* 古いブラウザ */ }
const store = {  // localStorage は file:// やプライベートモードで例外を投げうる
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 覚えられないだけ */ } },
};

/* ---------- 時刻（記録したホストのタイムゾーンで表示） ---------- */
const TZ = num(M.tz) || 0;
const p2 = n => String(n).padStart(2, "0");
const dt = t => new Date((t + TZ) * 1000);
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const fmtTime = t => { const d = dt(t); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`; };
const fmtHM = t => { const d = dt(t); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const fmtDate = t => { const d = dt(t); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`; };
const fmtDay = t => `${fmtDate(t)}（${WD[dt(t).getUTCDay()]}）`;
const fmtFull = t => `${fmtDate(t)} ${fmtTime(t)}`;
function fmtDur(s) {
  if (s == null || !(s >= 0)) return "";
  if (s < 1) return "<1s";
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + p2(Math.floor(s % 60)) + "s";
  return Math.floor(s / 3600) + "h " + p2(Math.floor((s % 3600) / 60)) + "m";
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

/* ---------- 端末の色（SGR）→ CSS クラス。色は形式を検証してから使う ---------- */
// 端末の配色: emaki が書き出すときに端末（QTerminal）の設定から読んだもの。無ければ既定の配色
const isHex = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);
const TP = M.palette && typeof M.palette === "object" ? M.palette : {};
const HAVEP = Array.isArray(TP.c) && TP.c.length === 16 && TP.c.every(isHex);
const PAL = HAVEP ? TP.c.slice()
  : ["#4b5568", "#ff6b81", "#3ddc97", "#ffcf5c", "#5aa9ff", "#d58bff", "#38d6e8", "#d5deec",
     "#6b7a94", "#ff8fa0", "#6ef0b6", "#ffe08a", "#8cc4ff", "#e3b0ff", "#7aeaf5", "#ffffff"];
const TFG = isHex(TP.fg) ? TP.fg : null, TBG = isHex(TP.bg) ? TP.bg : null;
const TFGI = isHex(TP.fgi) ? TP.fgi : TFG, TBGI = isHex(TP.bgi) ? TP.bgi : TBG;
const BOLDI = HAVEP && TP.bi === true;  // 太字を明るい色で描く端末（QTerminal など）
// 端末の背景が明るいか（暗い文字の方が読める）。開いたカードの中の文字色と、見出しのコマンドの背景を変える
function lumi(c) {
  const v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255)
    .map(x => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)));
  return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
}
const contrast = (a, b) => { const x = lumi(a), y = lumi(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
if (TBG) document.documentElement.classList.add(contrast("#3a3833", TBG) > contrast("#c9c6bc", TBG) ? "tlight" : "tdark");
function x256(n) {
  if (n < 16) return PAL[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }

  window.addEventListener("scroll", () => {
    if (!raf) raf = requestAnimationFrame(() => { raf = 0; updTop(); });
  }, { passive: true });
  window.addEventListener("resize", () => {

    const b = s && IDX.get(s.dataset.bid);
    if (b && !b.parentB) focused = b;
  });

  document.addEventListener("keydown", e => {
    if (e.target === Q) {
      if (e.key === "Enter") {

      case "k": move(-1); break;

      case "e": expandAll(true); break;
      case "c": expandAll(false); break;
      case "w": setWrap(!document.body.classList.contains("wrapon")); break;
