<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="generator" content="emaki (tmux-robust-logging)">
<title>__RL_TITLE__</title>
<style>
/*__RL_FONT__*/
:root{
  /* 配色: ダークニューモフィズム「Kiln」。面・影・光は同じ色相で明度だけを振り、区切りは凹凸で付ける。
     差し色は二つ: クレイ（押した・選んだ状態）とスカイ（リンク・情報・フォーカス） */
  --bg:#1E1D1B;--sh:#121211;--hl:#2B2A27;
  --fg:#F2F0E8;--fg-2:#D4D2CA;--muted:#9E9C94;--dim:#8A8881;--faint:#615F59;
  --accent:#E0896A;--accent-deep:#C46A4C;--info:#6A9BCC;
  --ok:#8FBF86;--err:#E05A52;--warn:#E2B85E;--run:#E0A452;
  --line:rgba(242,240,232,.07);--line-3:rgba(242,240,232,.18);
  --term-bg:#161514;--term-fg:#E6E3DA;
  /* 浮き出し（--up）とへこみ（--in）。一覧のカードは行ごとに描画を閉じ込める（content-visibility）ので、
     影は行の上下の余白 7px に収まる大きさにする */
  --up:3px 3px 6px var(--sh),-3px -3px 6px var(--hl);
  --up-lg:6px 6px 12px var(--sh),-6px -6px 12px var(--hl);
  --in:inset 3px 3px 6px var(--sh),inset -3px -3px 6px var(--hl);
  --in-sm:inset 2px 2px 4px var(--sh),inset -2px -2px 4px var(--hl);
  --in-lg:inset 5px 5px 10px var(--sh),inset -5px -5px 10px var(--hl);
  /* コマンドと出力は Fira Code（無ければ次の等幅フォント）。見出しは明朝、画面の文字は読みやすいゴシック */
  --mono:"Fira Code","FiraCode Nerd Font","FiraCode Nerd Font Mono","Fira Mono","JetBrains Mono","Cascadia Code","SF Mono",Menlo,Consolas,"Liberation Mono","Noto Sans Mono CJK JP","Noto Sans CJK JP","Hiragino Sans","Yu Gothic",monospace;
  --sans:"Noto Sans JP","Noto Sans CJK JP","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Segoe UI",system-ui,sans-serif;
  --serif:"Noto Serif JP","Noto Serif CJK JP","Source Han Serif JP","Hiragino Mincho ProN","Yu Mincho",Georgia,serif;
  --r:16px;
  --pc0:#6A9BCC;--pc1:#A796D4;--pc2:#6FB3A2;--pc3:#CDBB86;--pc4:#D98BA0;--pc5:#9DB86A;--pc6:#C795C9;--pc7:#8FA3B8;
  /* 閉じた行・日付の区切りの高さ。まだ作っていない行の見積もり（JS の EST / DAYH）と
     描画前の行の大きさ（.row の contain-intrinsic-size）にも使い、三つを揃えてスクロールのずれを無くす */
  --rowh:58px;--dayh:50px;--barh:120px;
}
*{box-sizing:border-box}
html{color-scheme:dark;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 var(--sans);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
code,kbd,pre,samp{font-family:var(--mono)}
::selection{background:rgba(106,155,204,.35)}
button:focus-visible{outline:2px solid var(--info);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.pc0{--pc:var(--pc0)}.pc1{--pc:var(--pc1)}.pc2{--pc:var(--pc2)}.pc3{--pc:var(--pc3)}
.pc4{--pc:var(--pc4)}.pc5{--pc:var(--pc5)}.pc6{--pc:var(--pc6)}.pc7{--pc:var(--pc7)}
.wrapx{max-width:1240px;margin:0 auto;padding:0 28px}

/* ---------- header ---------- */
.hero{padding:40px 0 22px}
.brand{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{margin:14px 0 10px;font:500 34px/1.25 var(--serif);color:var(--fg);overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:6px 18px}
.sub b{color:var(--fg-2);font-weight:500}
.notice{margin-top:18px;display:flex;gap:10px;align-items:flex-start;color:var(--fg-2);font-size:12.5px;background:var(--bg);box-shadow:var(--in);border-radius:16px;padding:12px 16px}
.notice .ni{color:var(--info)}
.notice .nb{flex:1;min-width:0}
.notice .code{display:inline;font:12px var(--mono);color:var(--info);background:rgba(106,155,204,.10);border:0;padding:1px 6px;border-radius:6px;cursor:pointer;overflow-wrap:anywhere;text-align:left}
.notice .code:hover{background:rgba(106,155,204,.18)}
.notice .nx{flex:none;width:24px;height:24px;padding:0;border:0;border-radius:50%;background:var(--bg);box-shadow:var(--up);color:var(--muted);font:14px/1 var(--sans);cursor:pointer}
.notice .nx:hover{color:var(--fg)}

/* ---------- toolbar ---------- */
.toolbar{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 12px 16px -14px #000}
.tb{padding-top:14px;padding-bottom:14px;display:flex;flex-direction:column;gap:14px}
.search{display:flex;align-items:center;gap:8px;background:var(--bg);box-shadow:var(--in-lg);border-radius:16px;padding:6px 8px 6px 14px;transition:box-shadow .15s}
.search:focus-within{box-shadow:var(--in-lg),0 0 0 2px rgba(106,155,204,.55)}
.search svg{flex:none;color:var(--muted)}
#q{flex:1;min-width:80px;background:transparent;border:0;outline:0;color:var(--fg);font:14px var(--mono);padding:8px 4px}
#q::placeholder{color:var(--muted);font-family:var(--sans)}
#q::-webkit-search-cancel-button{display:none}
kbd{font:11px var(--mono);color:var(--fg-2);background:var(--bg);border-radius:6px;padding:2px 7px;box-shadow:2px 2px 4px var(--sh),-2px -2px 4px var(--hl)}
/* ボタンは面から浮き出させる。押している間と、押したままの切り替え（.on）はへこませてクレイの文字に */
.btn{font:500 12px var(--sans);color:var(--fg-2);background:var(--bg);border:0;border-radius:12px;padding:7px 12px;cursor:pointer;box-shadow:var(--up);transition:box-shadow .15s,color .15s;white-space:nowrap}
.btn:hover{color:var(--fg)}
.btn:active{box-shadow:var(--in)}
.btn.mono{font-family:var(--mono)}
.btn.on{box-shadow:var(--in);color:var(--accent)}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--bg);box-shadow:var(--in)}
.seg .btn{box-shadow:none;border-radius:10px;padding:5px 10px;color:var(--muted)}
.seg .btn:hover{color:var(--fg)}
.seg .btn.on{box-shadow:var(--up);color:var(--accent)}
.count{font:12px var(--mono);color:var(--muted);min-width:70px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.count.bad{color:var(--err)}
.filters{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
#pane-chips{display:contents}
.chip{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:6px 13px;max-width:100%}
.chip .lbl{min-width:0;max-width:240px;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
/* 失敗・ペインのチップは表示中がオン（浮いたまま）。隠すと面に沈んで薄くなる */
#f-failed.on,.chip.pane.on{box-shadow:var(--up);color:var(--fg)}
.chip.off{box-shadow:none;opacity:.45}
.chip:disabled,#f-failed:disabled{box-shadow:none;opacity:.45;cursor:default;pointer-events:none}
.chip .x{color:var(--err);font-weight:700}
.chip .dot{flex:none;width:8px;height:8px;border-radius:50%;background:var(--pc)}
.vsep{width:1px;height:20px;background:var(--sh);box-shadow:1px 0 0 var(--hl);margin:0 4px}
.grow{flex:1}

/* ---------- timeline ---------- */
main{padding-top:18px;padding-bottom:70px}
.tl{position:relative}
.day{display:flex;align-items:center;gap:12px;height:var(--dayh);margin:0 0 0 98px;padding:24px 0 10px;color:var(--muted);font:500 12px var(--mono);letter-spacing:.12em;scroll-margin-top:calc(var(--barh) + 8px)}
.day::after{content:"";flex:1;height:1px;background:var(--sh);box-shadow:0 1px 0 var(--hl)}
/* 閉じた行の高さ = カードの上下の余白 14px + 見出し 44px = --rowh。
   行の外では影も切れるので、右にも余白を取り、その分だけ右へはみ出させて検索欄と幅を揃える */
.row{display:grid;grid-template-columns:76px 22px minmax(0,1fr);align-items:start;margin-right:-12px;padding-right:12px;content-visibility:auto;contain-intrinsic-size:auto var(--rowh);scroll-margin-top:calc(var(--barh) + 12px);scroll-margin-bottom:24px}
.row>.tm{font:12px/20px var(--mono);padding-top:19px;color:var(--dim);text-align:right;padding-right:10px;white-space:nowrap;font-variant-numeric:tabular-nums}
.row>.rail{position:relative;align-self:stretch}
/* 左の線は彫った溝、印はペインの色の輪。失敗は赤く塗り、実行中は橙、コマンド外は点線 */
.row>.rail::before{content:"";position:absolute;left:9px;top:0;bottom:0;width:2px;background:var(--sh);box-shadow:1px 0 0 var(--hl)}
.row>.rail::after{content:"";position:absolute;left:4px;top:23px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:3px solid var(--pc);box-shadow:0 0 0 3px var(--bg)}
.row.fail>.rail::after{background:var(--err);border-color:var(--err)}
.row.run>.rail::after{border-color:var(--run)}
.row.misc>.rail::after{border:2px dashed var(--dim)}
.card{margin:7px 0;border-radius:var(--r);background:var(--bg);box-shadow:var(--up);overflow:hidden}
.card.hit>.sum{background:rgba(226,184,94,.07)}
.sum{all:unset;box-sizing:border-box;display:flex;align-items:flex-start;gap:10px;width:100%;padding:12px 16px;cursor:pointer;min-height:44px}
.sum:focus-visible{outline:2px solid var(--info);outline-offset:-2px;border-radius:var(--r)}
/* プロンプトの ❯ がそのまま開閉の印（開くと 90° 回って下を向く） */
.pg{flex:none;display:inline-block;width:1.1em;text-align:center;font:700 14px/20px var(--mono);color:var(--pc);transition:transform .2s ease}
.card.open>.sum .pg{transform:rotate(90deg)}
.row.misc .pg{color:var(--dim)}
.kc{--pc:var(--run)}
.cmd{flex:1;min-width:0;max-height:20px;font:13.5px/20px var(--mono);white-space:pre;overflow:hidden;text-overflow:ellipsis;color:var(--fg)}
/* 開いたら（検索で今の一致がコマンドにあるときも）見出しのコマンドを折り返して全文を見せる。中では繰り返さない */
.card.open>.sum .cmd,.card.cmdcur>.sum .cmd{max-height:none;white-space:pre-wrap;word-break:break-all}
/* 開いている間は見出しのコマンドの文字を選択できる（文字の上のクリックでは閉じない。余白・❯・右側で閉じる） */
.card.open>.sum .ct{cursor:text;-webkit-user-select:text;user-select:text}
/* 複数行のコマンドは、閉じている間は 1 行目だけ（続きの行数の印） */
.mlh{flex:none;color:var(--dim);font:12px/20px var(--mono)}
.card.open>.sum>.mlh,.card.cmdcur>.sum>.mlh{display:none}
.cmd.misc{font-family:var(--sans);font-style:italic;color:var(--muted)}
.meta{flex:none;display:flex;align-items:center;gap:8px;height:20px;color:var(--dim);font:12px var(--mono);font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font:500 11.5px/14px var(--mono);background:var(--bg);box-shadow:var(--in-sm);white-space:nowrap}
.badge.ok{color:var(--ok)}
.badge.ok.inf{opacity:.62}
.badge.err{color:var(--err)}
.badge.run{color:var(--run)}
.badge.run::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--run);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.2}}
.badge.remote{flex:none;color:var(--info)}
.badge.hits{color:#1A1918;background:var(--warn);box-shadow:none}
.ptag{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:8px;background:var(--bg);box-shadow:var(--in-sm);color:var(--fg-2);font:11.5px/14px var(--mono);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptag::before{content:"";flex:none;width:7px;height:7px;border-radius:2px;background:var(--pc)}

/* ---------- body ---------- */
/* 開いたカードの中身は、端末の色のままのへこんだ窓。端末の色の上なのでボタンに凹凸は付けない */
.body{margin:0 10px 10px;border-radius:12px;background:var(--term-bg);box-shadow:inset 3px 3px 8px rgba(0,0,0,.55),inset -2px -2px 6px rgba(255,255,255,.03);overflow:hidden}
.bhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:12px 14px;border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted)}
.bhead .prompt{flex-basis:100%;color:var(--term-fg);white-space:pre-wrap;word-break:break-all;font-size:11.5px}
.fact{display:inline-flex;gap:6px;align-items:baseline;min-width:0;overflow-wrap:anywhere}
.fact i{font-style:normal;color:var(--dim)}
.fact span{color:var(--fg-2)}
.acts{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.body .btn{background:rgba(242,240,232,.07);box-shadow:none;padding:5px 10px;font-size:11.5px;border-radius:10px}
.body .btn:hover{background:rgba(242,240,232,.12)}
.out{margin:0;padding:10px 0;font:12.5px/1.62 var(--mono);color:var(--term-fg);overflow:auto;max-height:74vh;tab-size:8}
.l{display:flex;min-height:1.62em;padding-right:18px}
.l::before{content:attr(data-n);flex:none;width:6ch;padding-right:12px;margin-right:14px;text-align:right;color:var(--faint);border-right:1px solid var(--line);user-select:none;-webkit-user-select:none}
.l>.t{white-space:pre;flex:1}
.wrapon .l>.t{white-space:pre-wrap;word-break:break-all}
.l:hover{background:rgba(242,240,232,.04)}
.l:hover::before{color:var(--dim)}
.ph{margin:6px 18px 6px calc(6ch + 26px);padding:7px 12px;border:1px dashed var(--line-3);border-radius:10px;color:var(--muted);font:12px var(--sans);white-space:pre-wrap}
.more{display:block;margin:8px auto 12px;font:500 12px var(--sans);color:var(--info);background:transparent;border:1px solid rgba(106,155,204,.4);border-radius:10px;padding:6px 14px;cursor:pointer}
.more:hover{background:rgba(106,155,204,.10)}
.noout{padding:12px 16px;color:var(--dim);font:12px var(--sans)}
.kids{padding:12px 12px 12px 30px;border-top:1px solid var(--line);position:relative}
.kids::before{content:"";position:absolute;left:15px;top:14px;bottom:18px;width:2px;border-radius:2px;background:rgba(224,164,82,.35)}
.kids .card{box-shadow:0 2px 8px rgba(0,0,0,.4)}
.krow{scroll-margin-top:calc(var(--barh) + 12px)}
.kidtitle{font:500 11px var(--mono);letter-spacing:.08em;color:var(--run);margin:2px 0 8px}
/* 端末の配色が明るい（Kali-Light など）: 開いたカードの中（端末の背景色）は暗い文字。中の入れ子のカードは元の色。
   見出しのコマンドは、端末で見えていたとおり端末の背景色の上に */
.tlight .body{--fg:#1F1E1B;--fg-2:#3A3833;--muted:#55534D;--dim:#5F5D57;--faint:#8F8C84;--accent:#A84F33;--info:#2C5F8F;
  --line:rgba(31,30,27,.10);--line-3:rgba(31,30,27,.30);color-scheme:light}
.tlight .body .card{--fg:#F2F0E8;--fg-2:#D4D2CA;--muted:#9E9C94;--dim:#8A8881;--faint:#615F59;--accent:#E0896A;--info:#6A9BCC;
  --line:rgba(242,240,232,.07);--line-3:rgba(242,240,232,.18);color-scheme:dark}
.tlight .body .btn{background:rgba(31,30,27,.06)}
.tlight .body .btn:hover{background:rgba(31,30,27,.11)}
.tlight .body .card .btn{background:rgba(242,240,232,.07)}
.tlight .body .card .btn:hover{background:rgba(242,240,232,.12)}
.tlight .kidtitle{color:#8A5A12}
.tlight .l:hover{background:rgba(31,30,27,.05)}
.tlight .sum .ct{background:var(--term-bg);color:var(--term-fg);border-radius:4px;padding:0 4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
/* 端末の配色が暗い: 端末の背景色の上では、薄い文字（項目名・行番号）を少し明るく */
.tdark .body{--dim:#A3A198;--faint:#7A7871}
.tdark .body .card{--dim:#8A8881;--faint:#615F59}
mark{background:rgba(226,184,94,.28);color:inherit;border-radius:3px;box-shadow:0 0 0 1px rgba(226,184,94,.45)}
mark.cur{background:var(--warn);color:#1A1918;box-shadow:0 0 0 2px rgba(226,184,94,.6)}
/* 今の一致は、端末の色の付いた文字も暗い色で（黄色の上で読めるように。隠し文字は styleSheet で隠したまま） */
.out mark.cur>span,.tc mark.cur>span{color:#1A1918;background:transparent;opacity:1}
/* 長いコマンドの省略の印 */
.cmd .cut{color:var(--dim);font-style:italic}

/* ---------- misc ---------- */
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty h2{color:var(--fg);font:500 22px/1.4 var(--serif);margin:0 0 8px}
.empty p{margin:0}
/* 「検索とフィルタを解除」はこの画面の主な操作なので、クレイで塗る */
.empty .btn{margin-top:18px;padding:10px 18px;font-size:13px;font-weight:700;color:#1A1918;background:var(--accent);box-shadow:var(--up-lg)}
.empty .btn:hover{color:#1A1918;background:var(--accent-deep)}
footer{border-top:1px solid var(--sh);box-shadow:inset 0 1px 0 var(--hl);padding:26px 0 46px;color:var(--dim);font-size:12px}
footer details{margin-top:6px}
footer summary{cursor:pointer;color:var(--muted);list-style:none}
footer summary::-webkit-details-marker{display:none}
/* 開閉の印はカードと同じプロンプトの ❯（開くと 90° 回る） */
footer summary::before{content:"❯";display:inline-block;margin-right:8px;color:var(--info);font-family:var(--mono);transition:transform .2s ease}
footer details[open]>summary::before{transform:rotate(90deg)}
footer table{border-collapse:collapse;margin-top:8px;font:11.5px var(--mono)}
footer td{padding:4px 12px 4px 0;vertical-align:top;color:var(--muted);overflow-wrap:anywhere}
footer td:first-child{white-space:nowrap;color:var(--fg-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,16px);opacity:0;background:var(--bg);box-shadow:var(--up-lg);color:var(--fg);padding:9px 16px;border-radius:14px;font-size:13px;transition:opacity .18s,transform .18s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;background:rgba(10,10,9,.62)}
.hbox{background:var(--bg);border-radius:24px;padding:22px 28px;min-width:min(320px,100%);max-width:100%;max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 24px 60px -18px #000}
.hbox:focus{outline:none}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:0 0 14px}
.hbox h2{margin:0;font:500 18px var(--serif)}
.ib{width:30px;height:30px;padding:0;border:0;border-radius:50%;background:var(--bg);box-shadow:var(--up);color:var(--muted);font:16px/1 var(--sans);cursor:pointer}
.ib:hover{color:var(--fg)}
.hbox td{padding:6px 10px;color:var(--fg-2);font-size:13px}
.hbox td:first-child{text-align:right;white-space:nowrap}
.totop{position:fixed;right:22px;bottom:22px;z-index:30;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);box-shadow:var(--up-lg);color:var(--info);font-size:16px;cursor:pointer;opacity:0;visibility:hidden;transform:translateY(10px);transition:opacity .2s,transform .2s,visibility .2s}
.totop.show{opacity:1;visibility:visible;transform:none}
[hidden]{display:none!important}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:#3A3934;border-radius:8px;border:3px solid var(--bg)}
.out::-webkit-scrollbar-thumb{border-color:var(--term-bg)}
::-webkit-scrollbar-track{background:transparent}
*{scrollbar-color:#3A3934 transparent}
@media (max-width:760px){
  .wrapx{padding-left:14px;padding-right:14px}
  .row{grid-template-columns:0 16px minmax(0,1fr)}
  .row>.tm{visibility:hidden}
  .day{margin-left:16px}
  .meta .dur,.meta .nl,.ptag{display:none}
  h1{font-size:28px}
  .seg,.search kbd{display:none}
  .search{gap:6px}
  .search .btn{padding:6px 8px}
  #q{min-width:40px}
  .count{min-width:0;flex:none;font-size:11px}

<script id="rl-data" type="application/json">__RL_DATA__</script>
<script>
(() => {
"use strict";
/* ログの中身は攻撃者が制御しうる。描画は textContent / createTextNode だけで行い、
   innerHTML や href / src / style 属性にはデータを一切入れない。 */

/* ---------- データ ---------- */
let D = {};

const BLOCKS = (Array.isArray(D.blocks) ? D.blocks : []).filter(b => b && typeof b === "object");
const STYLES = Array.isArray(D.styles) ? D.styles : [];

const $ = s => document.querySelector(s);
const str = v => (typeof v === "string" ? v : "");
const num = v => (typeof v === "number" && isFinite(v) ? v : null);
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
let NF = null;
try { NF = new Intl.NumberFormat(); } catch (e) { /* Intl が無い環境 */ }
const fmtN = n => (NF ? NF.format(Number(n)) : String(n));  // toLocaleString は毎回だと遅い
function h(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function btn(cls, text, title) {
  const b = h("button", cls, text);
  b.type = "button";
  if (title) b.title = title;
  return b;
}
let RM = false;
try { RM = matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) { /* 古いブラウザ */ }
const store = {  // localStorage は file:// やプライベートモードで例外を投げうる
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* 覚えられないだけ */ } },
};

/* ---------- 時刻（記録したホストのタイムゾーンで表示） ---------- */
const TZ = num(M.tz) || 0;
const p2 = n => String(n).padStart(2, "0");
const dt = t => new Date((t + TZ) * 1000);
const WD = ["日", "月", "火", "水", "木", "金", "土"];
const fmtTime = t => { const d = dt(t); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}:${p2(d.getUTCSeconds())}`; };
const fmtHM = t => { const d = dt(t); return `${p2(d.getUTCHours())}:${p2(d.getUTCMinutes())}`; };
const fmtDate = t => { const d = dt(t); return `${d.getUTCFullYear()}-${p2(d.getUTCMonth() + 1)}-${p2(d.getUTCDate())}`; };
const fmtDay = t => `${fmtDate(t)} (${WD[dt(t).getUTCDay()]})`;
const fmtFull = t => `${fmtDate(t)} ${fmtTime(t)}`;
function fmtDur(s) {
  if (s == null || !(s >= 0)) return "";
  if (s < 1) return "<1s";
  if (s < 60) return Math.floor(s) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + p2(Math.floor(s % 60)) + "s";
  return Math.floor(s / 3600) + "h " + p2(Math.floor((s % 3600) / 60)) + "m";
}
function fmtBytes(n) {
  n = Number(n) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}

/* ---------- 端末の色（SGR）→ CSS クラス。色は形式を検証してから使う ---------- */
// 端末の配色: emaki が書き出すときに端末（QTerminal）の設定から読んだもの。無ければ既定の配色
const isHex = c => typeof c === "string" && /^#[0-9a-f]{6}$/i.test(c);
const TP = M.palette && typeof M.palette === "object" ? M.palette : {};
const HAVEP = Array.isArray(TP.c) && TP.c.length === 16 && TP.c.every(isHex);
const PAL = HAVEP ? TP.c.slice()
  : ["#4b5568", "#ff6b81", "#3ddc97", "#ffcf5c", "#5aa9ff", "#d58bff", "#38d6e8", "#d5deec",
     "#6b7a94", "#ff8fa0", "#6ef0b6", "#ffe08a", "#8cc4ff", "#e3b0ff", "#7aeaf5", "#ffffff"];
const TFG = isHex(TP.fg) ? TP.fg : null, TBG = isHex(TP.bg) ? TP.bg : null;
const TFGI = isHex(TP.fgi) ? TP.fgi : TFG, TBGI = isHex(TP.bgi) ? TP.bgi : TBG;
const BOLDI = HAVEP && TP.bi === true;  // 太字を明るい色で描く端末（QTerminal など）
// 端末の背景が明るいか（暗い文字の方が読める）。開いたカードの中の文字色と、見出しのコマンドの背景を変える
function lumi(c) {
  const v = [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255)
    .map(x => (x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4)));

}
const contrast = (a, b) => { const x = lumi(a), y = lumi(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
if (TBG) document.documentElement.classList.add(contrast("#3a3833", TBG) > contrast("#d4d2ca", TBG) ? "tlight" : "tdark");
function x256(n) {
  if (n < 16) return PAL[n];
  if (n >= 232) { const v = 8 + (n - 232) * 10; return `rgb(${v},${v},${v})`; }

  if (typeof c !== "string") return null;
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  let m = /^p(\d{1,2})$/.exec(c);
  if (m) return PAL[+m[1]] || null;
  m = /^x(\d{1,3})$/.exec(c);
  if (m && +m[1] < 256) return x256(+m[1]);
  return null;
}
(function styleSheet() {
  let css = "";
  // 端末の既定の文字色・背景色（出力の欄と開いたカードの中）
  if (TFG || TBG) css += ":root{" + (TFG ? "--term-fg:" + TFG + ";" : "") + (TBG ? "--term-bg:" + TBG + ";" : "") + "}";
  for (let i = 1; i < STYLES.length; i++) {
    const s = STYLES[i];
    if (!s || typeof s !== "object") continue;
    const f = Number.isInteger(s.f) ? s.f : 0;
    let fk = typeof s.fg === "string" ? s.fg : "", bk = typeof s.bg === "string" ? s.bg : "";
    const inv = !!(f & 32);
    if (inv) { const t = fk; fk = bk; bk = t; }
    let fg = col(fk), bg = col(bk);
    if (BOLDI && (f & 1)) {
      // 太字: 0〜7 番の色と既定の文字色は明るい側の色で描く（QTerminal と同じ。38;5;0〜7 も、tmux が
      // 30〜37 にして端末へ送るので同じ。8 番以降は変えない）
      const m = /^[px]([0-7])$/.exec(fk);
      if (m) fg = PAL[+m[1] + 8];
      else if (!fk) fg = inv ? TBGI : TFGI;
    }
    if (inv) { fg = fg || "var(--term-bg)"; bg = bg || "var(--term-fg)"; }
    let r = "";
    if (fg) r += `color:${fg};`;
    if (bg) r += `background:${bg};`;
    if (f & 1) r += "font-weight:700;";
    if (f & 2) r += "opacity:.62;";
    if (f & 4) r += "font-style:italic;";
    const dec = [];
    if (f & 8) dec.push("underline");
    if (f & 128) dec.push("line-through");
    if (dec.length) r += `text-decoration:${dec.join(" ")};`;
    if (f & 64) r += "color:transparent;";
    // 出力の欄と、端末の色で描くプロンプト・コマンド（.tc）に効かせる
    if (r) css += `.out .s${i},.tc .s${i}{${r}}`;
    if (f & 64) css += `.out mark.cur>.s${i},.tc mark.cur>.s${i}{color:transparent}`;  // 今の一致でも隠したまま
  }
  const st = document.createElement("style");
  st.textContent = css;
  document.head.appendChild(st);
})();
// スタイル番号は整数として検証できたものだけクラスにする
const sidCls = v => (Number.isInteger(v) && v > 0 && v < STYLES.length ? "s" + v : null);

/* ---------- データの下ごしらえ ---------- */
const isPh = x => x !== null && typeof x === "object" && !Array.isArray(x);  // alt / gap / cut のプレースホルダ
const isFail = b => b.exit != null && b.exit !== 0;
function norm(b) {
  if (!Array.isArray(b.out)) b.out = [];
  b.kind = str(b.kind) || "cmd";
  for (const k of ["cmd", "prompt", "cwd", "remote", "label"]) b[k] = str(b[k]);
  b.t = num(b.t);
  b.te = num(b.te);
  b.exit = num(b.exit);
  b.pane = Number.isInteger(b.pane) && b.pane >= 0 ? b.pane : 0;
  b.n = num(b.n);
  if (b.n == null) { let c = 0; for (const x of b.out) if (!isPh(x)) c++; b.n = c; }
  b.children = Array.isArray(b.children) ? b.children.filter(c => c && typeof c === "object") : [];
  b.hits = 0;
  b.ml = [];
  b._ht = "";
}
const ALL = [];
const IDX = new Map();
BLOCKS.forEach((b, i) => {
  norm(b);
  b.id = "b" + i;
  b.idx = i;
  b.vis = true;
  ALL.push(b);
  IDX.set(b.id, b);
  b.children.forEach((c, j) => {
    norm(c);
    c.children = [];
    c.id = b.id + "-" + j;
    c.parentB = b;
    c.pane = b.pane;
    ALL.push(c);
    IDX.set(c.id, c);
  });
  // リモート側の子コマンドの終了コードは相手の画面（右プロンプトの文字）から読んだもので、
  // 出力で偽装できる。親の状態（赤い点・失敗の件数・失敗の絞り込み）には数えない
  b.anyFail = isFail(b);
  b.hasRemote = b.children.length > 0;
});
const NCMD = BLOCKS.reduce((a, b) => a + (b.kind === "cmd" ? 1 : 0) + b.children.length, 0);
function lineText(ln) {
  if (typeof ln === "string") return ln;
  if (Array.isArray(ln)) {
    let s = "";
    for (const r of ln) if (Array.isArray(r) && typeof r[0] === "string") s += r[0];
    return s;
  }
  return "";
}
const plain = b => b._plain || (b._plain = b.out.map(lineText));
function pcls(i) {  // ペインの色はクラスで付ける（データを style に入れない）
  const p = PANES[i];
  const c = p && Number.isInteger(p.color) ? p.color : i;
  return "pc" + (((c % 8) + 8) % 8);
}
const MODE = { exact: "シェル統合（正確）", readline: "推定（入力行から）", regex: "推定（プロンプトの形から）",
               capture: "スクロールバックのみ" };
const modeName = m => (has(MODE, str(m)) ? MODE[str(m)] : str(m));
const remoteNames = b => [...new Set(b.children.map(c => c.remote).filter(Boolean))].join(" / ") || "リモート";

/* ---------- 状態 ---------- */
const S = {
  re: null, bad: false, lastQ: "", tm: 0, slow: false, gen: 0,
  cs: false, rx: false, scope: "all",
  matches: [], idx: -1, cur: null, capped: false,
  failed: false, hideFail: false, remote: false, hidden: new Set(),
};
const MAXNAV = 50000;   // 一致の移動リストの上限
const LINECAP = 2000;   // 1 行あたりに数える一致の上限
const K = 500;          // 出力を描く単位（行）
const FIRST = 1500;     // 開いたときに最初に描く行数
const FIRST_LAZY = 300; //「すべて展開」で開いたときに最初に描く行数
const STEP = 10;        //「N 行を表示」1 回で描くチャンク数（= 5000 行）
const NONE = [];
const BODIES = new Set();  // 本文（出力）を作ったブロック
let focused = null;

const Q = $("#q");
const TL = $("#tl");
const BAR = $("#bar");

/* ---------- プロンプトとコマンドの色（端末の画面に出ていた色） ---------- */
// rl: [[長さ, スタイル番号], ...]（長さは UTF-16 の単位）。検証してから使い、足りない分は色なし
function styledRuns(text, rl) {
  const out = [];
  let pos = 0;
  if (Array.isArray(rl)) {
    for (const r of rl) {
      if (pos >= text.length) break;
      if (!Array.isArray(r) || !Number.isInteger(r[0]) || r[0] <= 0) continue;
      const n = Math.min(r[0], text.length - pos);
      out.push([text.slice(pos, pos + n), sidCls(r[1])]);
      pos += n;
    }
  }
  if (pos < text.length) out.push([text.slice(pos), null]);
  return out;
}
// run 列の [s0, s1) の部分（長いコマンドの見出しに使う）
function sliceRuns(runs, s0, s1) {
  const out = [];
  let pos = 0;
  for (const [t, c] of runs) {
    const a = Math.max(s0, pos), z = Math.min(s1, pos + t.length);
    if (a < z) out.push([t.slice(a - pos, z - pos), c]);
    pos += t.length;
    if (pos >= s1) break;
  }
  return out;
}

/* ---------- 検索の一致範囲と <mark> ---------- */
function findRanges(t, re) {
  const out = [];
  if (!t || !re) return out;
  re.lastIndex = 0;
  let m;
  while ((m = re.exec(t))) {
    if (m[0].length === 0) { re.lastIndex++; continue; }
    out.push([m.index, m.index + m[0].length]);
    if (out.length >= LINECAP) { out.capped = true; break; }  // これ以上は数えない（件数に + を付ける）
  }
  return out;
}
// run 列（[text, class]）を、一致範囲に <mark> を掛けながら描く（textContent のみ = 安全）
function appendRuns(parent, runs, ranges, cur) {
  let pos = 0, ri = 0;
  for (const [t, cls] of runs) {
    const L = t.length;
    let off = 0;
    while (off < L) {
      const abs = pos + off;
      while (ri < ranges.length && ranges[ri][1] <= abs) ri++;
      let end = L, hit = false;
      if (ri < ranges.length) {
        const [s, e] = ranges[ri];
        if (s <= abs) { hit = true; end = Math.min(L, e - pos); }
        else end = Math.min(L, s - pos);
      }
      const piece = t.slice(off, end);
      let node = cls ? h("span", cls, piece) : document.createTextNode(piece);
      if (hit) { const mk = h("mark", ri === cur ? "cur" : null); mk.appendChild(node); node = mk; }
      parent.appendChild(node);
      off = end;
    }
    pos += L;
  }

const curIndexFor = (b, line) => (S.cur && S.cur.b === b && S.cur.line === line ? S.cur.k : -1);
const CMDMAX = 4000;  // 見出しに描くコマンドの長さの上限（全文は開いたカードの「全文を表示」か「コマンドをコピー」で）
function paintCmd(b) {
  if (!b.cmdEl || !b.cmd) return;
  const r = S.re && S.scope !== "out" ? findRanges(b.cmd, S.re) : NONE;
  const L = b.cmd.length, ci = curIndexFor(b, -1);
  // 長いコマンドは CMDMAX 文字ぶんだけ描く。今の一致がその先にあるときは、一致の周りを切り出して描く
  // （数えた一致は必ず画面で見えるようにする）
  let s0 = 0, s1 = L;

    const m = ci >= 0 ? r[ci] : null;
    if (m && m[1] > CMDMAX) s0 = Math.max(0, Math.min(L - CMDMAX, m[0] - (CMDMAX >> 1)));
    s1 = s0 + CMDMAX;

  if (s0 || s1 < L) {  // 切り出した範囲にかかる一致だけを、範囲の先頭からの位置に直す

    z = a;
    while (z < r.length && r[z][0] < s1) z++;

    for (let k = a; k < z; k++) rr.push([Math.max(r[k][0], s0) - s0, Math.min(r[k][1], s1) - s0]);

  const ct = h("span", "ct");

    const s = e.target.closest && e.target.closest(".sum");
    const b = s && IDX.get(s.dataset.bid);
    if (b && !b.parentB) focused = b;
  });
  window.addEventListener("hashchange", openFromHash);
  document.addEventListener("keydown", e => {
    if (e.target === Q) {
      if (e.key === "Enter") {
        if (e.isComposing || e.keyCode === 229) return;  // 変換の確定は検索の移動にしない
        e.preventDefault();
        go(e.shiftKey ? -1 : 1);
      } else if (e.key === "Escape") {
        if (Q.value) { Q.value = ""; runSearch(); } else Q.blur();
      } else if (e.altKey && (e.code === "KeyC" || e.key === "c" || e.key === "C")) { e.preventDefault(); toggleOpt("cs"); }
      else if (e.altKey && (e.code === "KeyR" || e.key === "r" || e.key === "R")) { e.preventDefault(); toggleOpt("rx"); }
      return;
    }
    if (e.key === "Escape") {
      if (!$("#help").hidden) openHelp(false);
      return;
    }
    if (e.target.closest && e.target.closest("input,textarea,select,[contenteditable]")) return;
    if (e.ctrlKey || e.metaKey || e.altKey || !$("#help").hidden) return;
    // Shift + 英字は大文字として扱う（キーボードの配列や入力方法によっては e.key が小文字のまま来る）
    const key = e.shiftKey && /^[a-z]$/.test(e.key) ? e.key.toUpperCase() : e.key;
    switch (key) {
      case "/": Q.focus(); Q.select(); break;
      case "n": go(1); break;
      case "N": go(-1); break;
      case "j": move(1); break;
      case "k": move(-1); break;
      case "o": if (focused) toggle(focused); break;
      case "e": expandAll(true); break;
      case "c": expandAll(false); break;
      case "w": setWrap(!document.body.classList.contains("wrapon")); break;
      case "g": window.scrollTo({ top: 0 }); break;
      case "G": {
        let i = BLOCKS.length - 1;
        while (i >= 0 && !BLOCKS[i].vis) i--;
        if (i >= 0) ensureRow(BLOCKS[i]);
        // すべて展開した後は、末尾付近の中身が飛んだ後に作られて伸びるので、末尾に着くまで当て直す
        settle(() => window.scrollTo({ top: document.documentElement.scrollHeight }));
        break;
      }
      case "?": openHelp(true); break;
      default: return;
    }
    e.preventDefault();
  });
}
function openFromHash() {
  let id = "";
  try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) { return; }
  const b = IDX.get(id);
  if (!b) return;
  ensureRow(b);
  if (b.parentB) toggle(b.parentB, true);
  if (!b.card) return;
  toggle(b, true);
  requestAnimationFrame(() => (b.row || b.card).scrollIntoView({ block: "start" }));
}
function renderEmpty() {
  if (BLOCKS.length) return;
  const e = $("#empty");
  e.dataset.kind = "none";
  e.appendChild(h("h2", null, "このセッションのログが見つかりませんでした"));
  e.appendChild(h("p", null, "ロギング中のペインが無いか、まだ何も記録されていません。prefix + P（または @rl_auto_start on）でロギングを開始してください。"));
}

renderHeader();
renderFilters();
initGroups();
renderEmpty();
renderFooter();
if (store.get("emaki.wrap") === "1") setWrap(true);
bind();
measureBar();
refresh();
openFromHash();
})();
</script>
</body>
